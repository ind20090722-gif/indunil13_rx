<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL REGISTER | INDUNIL13_RX</title>
    <style>
        :root {
            --primary: #00ff41;
            --bg-dark: #050505;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--primary);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: radial-gradient(circle, #001a00 0%, #000 100%);
        }

        .reg-box {
            width: 500px;
            padding: 30px;
            border: 1px solid var(--primary);
            background: rgba(0, 15, 0, 0.95);
            box-shadow: 0 0 30px rgba(0, 255, 65, 0.2);
        }

        h2 { text-align: center; letter-spacing: 5px; border-bottom: 2px solid var(--primary); padding-bottom: 10px; margin-top: 0; }

        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }

        .field { margin-bottom: 15px; }
        .full-width { grid-column: span 2; }

        label { display: block; font-size: 11px; margin-bottom: 5px; color: #888; }

        input, select {
            width: 100%;
            padding: 10px;
            background: #000;
            border: 1px solid var(--primary);
            color: var(--primary);
            outline: none;
            box-sizing: border-box;
            font-family: 'Courier New', Courier, monospace;
        }

        .btn-reg {
            width: 100%;
            padding: 15px;
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .btn-reg:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 20px var(--primary);
        }

        #status-log { margin-top: 15px; font-size: 11px; text-align: center; }
    </style>
</head>
<body>

    <div class="reg-box">
        <h2>CREATE_OPERATOR_ID</h2>
        
        <div class="form-grid">
            <div class="field full-width">
                <label>FULL NAME</label>
                <input type="text" id="regName" placeholder="R M N Indunil Rathnayake">
            </div>

            <div class="field full-width">
                <label>EMAIL (USERNAME)</label>
                <input type="email" id="regEmail" placeholder="example@mail.com">
            </div>

            <div class="field full-width">
                <label>SET PASSWORD (MIN 6 CHARS)</label>
                <input type="password" id="regPass" placeholder="********">
            </div>

            <div class="field">
                <label>WHATSAPP NO</label>
                <input type="text" id="regWA" placeholder="07XXXXXXXX">
            </div>

            <div class="field">
                <label>DATE OF BIRTH</label>
                <input type="date" id="regDOB">
            </div>

            <div class="field full-width">
                <label>ADDRESS</label>
                <input type="text" id="regAddress" placeholder="Poramadulla, Rikillagaskada">
            </div>

            <div class="field">
                <label>STATUS</label>
                <select id="regStatus">
                    <option value="Student">Student</option>
                    <option value="Adult">Adult</option>
                </select>
            </div>

            <div class="field">
                <label>ACCESS LEVEL</label>
                <input type="text" value="USER" disabled style="opacity: 0.6;">
            </div>
        </div>

        <button class="btn-reg" id="btnRegister">Execute Registration</button>

        <div id="status-log">/ready_for_new_entry...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Your Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyAhWHf3sK1eLEwFg7p8KARQcXLkRO2R7ZQ",
            authDomain: "my-persweb.firebaseapp.com",
            projectId: "my-persweb",
            storageBucket: "my-persweb.firebasestorage.app",
            messagingSenderId: "327180060390",
            appId: "1:327180060390:web:ad2c904ad4d4b0347a9d27"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const statusLog = document.getElementById('status-log');

        document.getElementById('btnRegister').addEventListener('click', async () => {
            const email = document.getElementById('regEmail').value;
            const pass = document.getElementById('regPass').value;
            const name = document.getElementById('regName').value;
            const wa = document.getElementById('regWA').value;
            const addr = document.getElementById('regAddress').value;
            const dob = document.getElementById('regDOB').value;
            const status = document.getElementById('regStatus').value;

            if(!email || !pass || !name) {
                statusLog.style.color = "red";
                statusLog.innerText = "> ERROR: CRITICAL FIELDS MISSING.";
                return;
            }

            statusLog.style.color = "var(--primary)";
            statusLog.innerText = "> INITIATING FIREBASE AUTH...";

            try {
                // 1. Authentication හරහා Account එකක් සෑදීම
                const userCredential = await createUserWithEmailAndPassword(auth, email, pass);
                const user = userCredential.user;

                // 2. Firestore හි /login/ යටතේ දත්ත ගබඩා කිරීම
                await setDoc(doc(db, "login", user.uid), {
                    Username: email,
                    Name: name,
                    WhatsAppNo: wa,
                    Address: addr,
                    DOB: dob,
                    Status: status,
                    Access: "no", // Default ලියාපදිංචි වන අයට access 'no' ලෙස ලැබේ
                    Role: "User",
                    RegisteredAt: serverTimestamp()
                });

                statusLog.innerText = "> REGISTRATION SUCCESSFUL. REDIRECTING...";
                setTimeout(() => { window.location.href = "login.html"; }, 2000);

            } catch (error) {
                statusLog.style.color = "red";
                statusLog.innerText = "> FAILED: " + error.message;
            }
        });
    </script>
</body>
</html>
