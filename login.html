<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TERMINAL LOGIN | INDUNIL13_RX</title>
    <style>
        :root {
            --primary: #00ff41;
            --bg-dark: #050505;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--primary);
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background: radial-gradient(circle, #001a00 0%, #000 100%);
        }

        .login-frame {
            width: 350px;
            padding: 30px;
            border: 1px solid var(--primary);
            background: rgba(0, 10, 0, 0.9);
            box-shadow: 0 0 20px rgba(0, 255, 65, 0.2);
        }

        h2 { text-align: center; letter-spacing: 5px; border-bottom: 1px solid var(--primary); padding-bottom: 10px; }

        .field { margin-bottom: 20px; }
        label { display: block; font-size: 10px; margin-bottom: 5px; color: #888; }

        input {
            width: 100%;
            padding: 12px;
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            outline: none;
            box-sizing: border-box;
        }

        .btn-auth {
            width: 100%;
            padding: 15px;
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .btn-auth:hover {
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 20px var(--primary);
        }

        .forgot-pass {
            display: block;
            text-align: right;
            font-size: 10px;
            margin-top: 10px;
            color: #888;
            cursor: pointer;
            text-decoration: underline;
        }

        .forgot-pass:hover { color: var(--primary); }

        #status-msg { margin-top: 15px; font-size: 11px; text-align: center; min-height: 20px; }
    </style>
</head>
<body>

    <div class="login-frame">
        <h2>AUTHENTICATE</h2>
        
        <div class="field">
            <label>OPERATOR EMAIL</label>
            <input type="email" id="email" placeholder="example@mail.com">
        </div>

        <div class="field">
            <label>SECURITY KEY (PASSWORD)</label>
            <input type="password" id="pass" placeholder="********">
        </div>

        <button class="btn-auth" id="btnLogin">Execute Login</button>
        
        <span class="forgot-pass" id="btnForgot">Forgot Password? Reset Key</span>

        <div id="status-msg">/waiting_for_credentials...</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        // Your Config
        const firebaseConfig = {
            apiKey: "AIzaSyAhWHf3sK1eLEwFg7p8KARQcXLkRO2R7ZQ",
            authDomain: "my-persweb.firebaseapp.com",
            projectId: "my-persweb",
            storageBucket: "my-persweb.firebasestorage.app",
            messagingSenderId: "327180060390",
            appId: "1:327180060390:web:ad2c904ad4d4b0347a9d27"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const statusMsg = document.getElementById('status-msg');

        // --- LOGIN LOGIC ---
        document.getElementById('btnLogin').addEventListener('click', async () => {
            const email = document.getElementById('email').value;
            const password = document.getElementById('pass').value;

            if(!email || !password) {
                statusMsg.style.color = "red";
                statusMsg.innerText = "> ERROR: CREDENTIALS REQUIRED.";
                return;
            }

            statusMsg.style.color = "var(--primary)";
            statusMsg.innerText = "> INITIATING AUTH_SYNC...";

            try {
                await signInWithEmailAndPassword(auth, email, password);
                statusMsg.innerText = "> ACCESS GRANTED. REDIRECTING TO HOME...";
                
                // සාර්ථක වූ පසු home.html වෙත යොමු කරයි
                setTimeout(() => { window.location.href = "home.html"; }, 1500);
            } catch (error) {
                statusMsg.style.color = "red";
                statusMsg.innerText = "> AUTH_ERROR: INVALID KEY.";
            }
        });

        // --- FORGOT PASSWORD LOGIC ---
        document.getElementById('btnForgot').addEventListener('click', async () => {
            const email = document.getElementById('email').value;

            if (!email) {
                statusMsg.style.color = "yellow";
                statusMsg.innerText = "> INPUT EMAIL FIRST TO RESET KEY.";
                return;
            }

            try {
                await sendPasswordResetEmail(auth, email);
                statusMsg.style.color = "var(--primary)";
                statusMsg.innerText = "> RESET LINK SENT TO YOUR EMAIL.";
            } catch (error) {
                statusMsg.style.color = "red";
                statusMsg.innerText = "> ERROR: " + error.code;
            }
        });
    </script>
</body>
</html>
